services:
  postgres:
    image: postgres:16
    container_name: intereses-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-intereses_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-intereses_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: intereses-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"

  backend:
    build: ./backend
    container_name: intereses-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      UPLOADS_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  frontend:
    build: ./frontend
    container_name: intereses-frontend
    restart: unless-stopped
    ports:
      - "4201:80"
    depends_on:
      - backend
    profiles: ["full"]

volumes:
  pgdata:
  uploads:
